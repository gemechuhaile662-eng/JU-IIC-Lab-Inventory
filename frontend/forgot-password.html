<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — JU-IIC Lab</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .auth-wrap { max-width: 400px; margin: 60px auto; padding: 0 20px; }
    .auth-card { background: var(--surface); padding: 32px 24px; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border); text-align: center; }
    .auth-card h2 { font-size: 22px; margin-bottom: 8px; }
    .auth-card p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .form-field { text-align: left; margin-bottom: 16px; }
    .form-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-field input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 15px; }
    .form-submit { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .form-submit:hover { background: var(--primary-dark); }
    .back-link { display: inline-block; margin-top: 20px; font-size: 14px; color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Reset Password</h2>
      <p>Enter your email and we'll send you a link to reset it.</p>
      
      <div id="errorMsg" style="display:none; background:#fee2e2; color:#b91c1c; padding:10px; border-radius:8px; font-size:13px; margin-bottom:16px;"></div>
      <div id="successMsg" style="display:none; background:#dcfce7; color:#15803d; padding:10px; border-radius:8px; font-size:13px; margin-bottom:16px;"></div>

      <form id="forgotForm" onsubmit="handleForgot(event)">
        <div class="form-field">
          <label>Email Address</label>
          <input type="email" id="emailInput" required placeholder="you@lab.edu">
        </div>
        <button type="submit" class="form-submit" id="submitBtn">Send Reset Link</button>
      </form>
      
      <a href="index.html" class="back-link">← Back to Login</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('emailInput').value.trim();
      const err = document.getElementById('errorMsg');
      const succ = document.getElementById('successMsg');
      
      err.style.display = 'none'; succ.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Sending...';

      try {
        await api.post('/api/auth/forgot-password', { email });
        succ.textContent = '✅ A reset link has been sent to your email. Please check your inbox.';
        succ.style.display = 'block';
        document.getElementById('forgotForm').reset();
      } catch (error) {
        err.textContent = '❌ ' + (error.message || 'Failed to send email.');
        err.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'Send Reset Link';
      }
    }
  </script>
</body>
</html>
