<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — Lab Inventory</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .login-wrap {
      max-width: 420px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo img {
      width: 72px;
      height: 72px;
    }
    .login-logo h1 {
      font-size: 22px;
      margin-top: 12px;
    }
    .login-logo p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .login-card {
      background: var(--surface);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .form-tabs {
      display: flex;
      background: var(--surface-2);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .form-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .form-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-family: inherit;
      transition: border-color .15s;
    }
    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--primary-dark); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg {
      background: #fee2e2;
      color: #b91c1c;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.show { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-logo">
      <img src="assets/logo.svg" alt="Lab">
      <h1>Lab Inventory</h1>
      <p>Smart equipment tracking</p>
    </div>

    <div class="login-card">
      <div class="form-tabs">
        <button class="form-tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="form-tab" id="tabRegister" onclick="switchTab('register')">Register</button>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <!-- LOGIN -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label>Email</label>
          <input type="email" id="loginEmail" required placeholder="you@lab.edu" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">Sign In</button>
      </form>

      <!-- REGISTER -->
      <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="regName" required placeholder="Abebe Kebede">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="regEmail" required placeholder="you@lab.edu" autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="field">
          <label>Role</label>
          <select id="regRole">
            <option value="Viewer">Viewer</option>
            <option value="Technician">Technician</option>
            <option value="Storekeeper">Storekeeper</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <div class="field">
          <label>Phone (optional)</label>
          <input type="tel" id="regPhone" placeholder="+251911000000">
        </div>
        <button type="submit" class="btn-submit" id="registerBtn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // If already logged in → go home
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const me = await api.get('/api/auth/me');
        if (me && me.user_id) {
          sessionStorage.setItem('user', JSON.stringify(me));
          location.href = 'index.html';
        }
      } catch (e) {}
    });

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      hideError();
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const res = await api.post('/api/auth/login', { email, password });
        sessionStorage.setItem('user', JSON.stringify(res.user));
        location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Login failed');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      try {
        const body = {
          full_name: document.getElementById('regName').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          password: document.getElementById('regPassword').value,
          role: document.getElementById('regRole').value,
          phone: document.getElementById('regPhone').value.trim() || null,
        };
        const res = await api.post('/api/auth/register', body);
        sessionStorage.setItem('user', JSON.stringify(res.user));
        location.href = 'index.html';
      } catch (err) {
        showError(err.message || 'Registration failed');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('errorMsg').classList.remove('show');
    }
  </script>
</body>
</html>
