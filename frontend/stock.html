<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stock Management — Lab Inventory</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .txn-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 8px;
    }
    .txn-left { display: flex; align-items: center; gap: 12px; }
    .txn-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .txn-icon.in { background: #dcfce7; color: #15803d; }
    .txn-icon.out { background: #fee2e2; color: #b91c1c; }
    .txn-details { font-size: 14px; font-weight: 600; }
    .txn-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .txn-qty { font-size: 16px; font-weight: 800; }
    .txn-qty.in { color: #15803d; }
    .txn-qty.out { color: #b91c1c; }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="icon-btn" onclick="location.href='dashboard.html'">←</button>
    <h1>Stock Management</h1>
    <span style="width:34px"></span>
  </header>

  <main class="main">
    <!-- Action Buttons -->
    <div class="quick-actions" style="grid-template-columns: 1fr 1fr;">
      <button class="quick-btn" onclick="openModal('IN')" style="background: #f0fdf4; border-color: #bbf7d0;">
        <div class="qb-icon" style="background: #dcfce7; color: #15803d;">📥</div>
        <div class="qb-text">
          <div class="qb-title" style="color: #15803d;">Stock In</div>
          <div class="qb-sub">Add components</div>
        </div>
      </button>
      
      <button class="quick-btn" onclick="openModal('OUT')" style="background: #fef2f2; border-color: #fecaca;">
        <div class="qb-icon" style="background: #fee2e2; color: #b91c1c;">📤</div>
        <div class="qb-text">
          <div class="qb-title" style="color: #b91c1c;">Stock Out</div>
          <div class="qb-sub">Remove components</div>
        </div>
      </button>
    </div>

    <div class="section-header" style="margin-top: 24px;">
      <h2>Recent Movements</h2>
    </div>
    
    <div id="txnList">
      <div class="skeleton" style="height: 65px; margin-bottom: 8px;"></div>
      <div class="skeleton" style="height: 65px; margin-bottom: 8px;"></div>
    </div>
  </main>

  <!-- MODAL FOR STOCK IN/OUT -->
  <div id="stockModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:var(--surface); border-radius:var(--radius); width:100%; max-width:400px; padding:24px; box-shadow:var(--shadow-lg);">
      <h2 id="modalTitle" style="font-size:20px; margin-bottom:16px;">Stock</h2>
      
      <div class="form-field">
        <label>Select Component</label>
        <select id="modalComponentId" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-family:inherit;"></select>
      </div>
      
      <div class="form-field">
        <label>Quantity</label>
        <input type="number" id="modalQty" min="1" value="1" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); font-family:inherit;">
      </div>

      <div class="form-field">
        <label>Notes / Reason</label>
        <input type="text" id="modalNotes" placeholder="e.g. Purchased from supplier" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); font-family:inherit;">
      </div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn" style="flex:1;" onclick="closeModal()">Cancel</button>
        <button class="btn primary" style="flex:1;" id="modalSubmitBtn" onclick="submitStock()">Confirm</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let COMPONENTS = [];
    let CURRENT_MODE = 'IN';

    // Load data when page opens
    window.addEventListener('DOMContentLoaded', async () => {
      try { 
        await requireAuth(); 
      } catch (e) { return; }
      
      renderUserChip();
      
      // Load components for the dropdown
      try {
        const items = await api.get('/api/items');
        // Map the backend data to the format the frontend needs
        COMPONENTS = items
          .filter(i => i.item_type === 'component')
          .map(i => ({
            id: i.id,
            name: i.name
          }));
        console.log("Loaded components:", COMPONENTS);
      } catch (e)  {
        console.error("Failed to load components", e);
      }

      loadRecentTransactions();
    });

    async function loadRecentTransactions() {
      try {
        const txns = await api.get('/api/stock/recent');
        const list = document.getElementById('txnList');

        if (!txns || txns.length === 0) {
          list.innerHTML = '<div class="empty-state">No recent stock movements.</div>';
          return;
        }

        list.innerHTML = txns.map(t => {
          const isIn = t.txn_type === 'IN';
          return `
            <div class="txn-row">
              <div class="txn-left">
                <div class="txn-icon ${isIn ? 'in' : 'out'}">${isIn ? '📥' : '📤'}</div>
                <div>
                  <div class="txn-details">${t.component_name}</div>
                  <div class="txn-meta">${t.notes} • ${t.user_name} • ${new Date(t.txn_date).toLocaleDateString()}</div>
                </div>
              </div>
              <div class="txn-qty ${isIn ? 'in' : 'out'}">
                ${isIn ? '+' : '-'}${t.quantity}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error("Failed to load transactions", e);
      }
    }

    function openModal(mode) {
      CURRENT_MODE = mode;
      document.getElementById('modalTitle').textContent = mode === 'IN' ? '📥 Stock In' : '📤 Stock Out';
      document.getElementById('modalTitle').style.color = mode === 'IN' ? '#15803d' : '#b91c1c';
      document.getElementById('modalSubmitBtn').textContent = mode === 'IN' ? 'Add Stock' : 'Remove Stock';
      document.getElementById('modalSubmitBtn').className = 'btn ' + (mode === 'IN' ? 'primary' : '');
      
      // Populate dropdown
      const select = document.getElementById('modalComponentId');
      if (COMPONENTS.length === 0) {
        select.innerHTML = '<option value="">No components available</option>';
      } else {
        select.innerHTML = COMPONENTS.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
      
      document.getElementById('modalQty').value = 1;
      document.getElementById('modalNotes').value = '';
      document.getElementById('stockModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('stockModal').style.display = 'none';
    }

    async function submitStock() {
      const btn = document.getElementById('modalSubmitBtn');
      const compId = document.getElementById('modalComponentId').value;
      const qty = parseInt(document.getElementById('modalQty').value);
      const notes = document.getElementById('modalNotes').value || (CURRENT_MODE === 'IN' ? 'Added stock' : 'Removed stock');

      if (!compId) {
        alert('Please select a component.');
        return;
      }
      if (qty < 1 || isNaN(qty)) {
        alert('Please enter a valid quantity (1 or more).');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const endpoint = CURRENT_MODE === 'IN' ? '/api/stock/in' : '/api/stock/out';
        
        // Submit to backend
        await api.post(endpoint, { 
            component_id: parseInt(compId), 
            quantity: qty, 
            notes: notes 
        });
        
        alert('✅ Stock updated successfully!');
        closeModal();
        loadRecentTransactions(); // Refresh list
      } catch (err) {
        alert('❌ Failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = CURRENT_MODE === 'IN' ? 'Add Stock' : 'Remove Stock';
      }
    }
  </script>
</body>
</html>
