<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — JU-IIC Lab</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <style>
    .auth-wrap { max-width: 400px; margin: 60px auto; padding: 0 20px; }
    .auth-card { background: var(--surface); padding: 32px 24px; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--border); text-align: center; }
    .auth-card h2 { font-size: 22px; margin-bottom: 8px; }
    .auth-card p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .form-field { text-align: left; margin-bottom: 16px; }
    .form-field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-field input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 15px; }
    .form-submit { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Create New Password</h2>
      <p>Please enter a strong new password for your account.</p>
      
      <div id="errorMsg" style="display:none; background:#fee2e2; color:#b91c1c; padding:10px; border-radius:8px; font-size:13px; margin-bottom:16px;"></div>

      <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-field">
          <label>New Password</label>
          <input type="password" id="passwordInput" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="form-submit" id="submitBtn">Reset Password</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      alert('Invalid reset link. Missing token.');
      location.href = 'index.html';
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('passwordInput').value;
      const err = document.getElementById('errorMsg');
      
      err.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Resetting...';

      try {
        await api.post('/api/auth/reset-password', { token, password });
        alert('✅ Password reset successfully! You can now log in.');
        location.href = 'index.html';
      } catch (error) {
        err.textContent = '❌ ' + (error.message || 'Failed to reset password.');
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    }
  </script>
</body>
</html>
